[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "videoagents-studio"
version = "0.1.0"
description = "A local React and LangGraph video production studio powered by Remotion"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "langgraph>=1.2.12,<1.3",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "playwright>=1.55,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
videoagents = "videoagents.main:main"
videoagents-worker = "worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["videoagents", "server", "worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
